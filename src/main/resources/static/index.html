<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生管理系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-head">
      <h1>学生管理系统</h1>
      <p class="hint">数据来自 ApiServer · Service 层与命令行版共用</p>
    </header>

    <div id="patchPhoneModal" style="display:none;position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);background:#fff;padding:24px;border:1px solid #999;border-radius:8px;z-index:999;">
      <h4>修改手机号</h4>
      <input type="text" id="patchPhoneInput" placeholder="请输入手机号">
      <div style="margin-top:12px;">
        <button id="confirmPatch">确认修改</button>
        <button id="cancelPatch" style="margin-left:8px;">取消</button>
      </div>
    </div>

    <section class="toolbar">
      <label for="classid">班级</label>
      <select id="classid">
        <option value="">请选择班级</option>
      </select>
      <label for="nameSearch">姓名搜索</label>
      <input type="text" id="nameSearch" placeholder="输入姓名过滤">
      <button id="reload" type="button" class="btn btn-ghost">刷新</button>
      <span id="status" class="status"></span>
    </section>

    <section class="table-wrap">
      <p id = "totalTip"></p>
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>姓名</th>
            <th>性别</th>
            <th>年龄</th>
            <th>班级ID</th>
            <th>电话</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="studentRows"></tbody>
      </table>
      <p id="empty" class="empty">先在上面选一个班级</p>
    </section>

    <section class="form-card">
      <h2 id="formTitle">新增学生</h2>
      <form id="addForm" class="form-grid">
        <label>
          姓名
          <input name="name" type="text" required maxlength="50">
        </label>
        <label>
          性别
          <select name="gender">
            <option value="男">男</option>
            <option value="女">女</option>
          </select>
        </label>
        <label>
          年龄
          <input name="age" type="number" min="1" max="150" required>
        </label>
        <label>
          电话
          <input name="phone" type="text" maxlength="20">
        </label>
        <button id="submitBtn" type="submit" class="btn btn-primary">提交</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
